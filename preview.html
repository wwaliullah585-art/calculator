<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Quantum Scientific Calculator</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

:root {
    --bg1: #050816;
    --bg2: #0b1228;
    --panel: rgba(15, 23, 42, 0.82);
    --button: rgba(30, 41, 59, 0.85);
    --button-hover: rgba(51, 65, 85, 0.95);
    --text: #f8fafc;
    --muted: #94a3b8;
    --primary: #00e5ff;
    --secondary: #7c3aed;
    --danger: #ef4444;
    --success: #22c55e;
    --border: rgba(255,255,255,0.1);
}

body.light {
    --bg1: #e0f2fe;
    --bg2: #f8fafc;
    --panel: rgba(255,255,255,0.85);
    --button: rgba(226,232,240,0.9);
    --button-hover: rgba(203,213,225,1);
    --text: #0f172a;
    --muted: #64748b;
    --border: rgba(15,23,42,0.1);
}

body {
    min-height: 100vh;
    font-family: Arial, Helvetica, sans-serif;
    color: var(--text);
    background:
        radial-gradient(circle at 10% 20%, rgba(124,58,237,.25), transparent 30%),
        radial-gradient(circle at 90% 80%, rgba(0,229,255,.18), transparent 30%),
        linear-gradient(135deg, var(--bg1), var(--bg2));
    display: flex;
    align-items: center;
    justify-content: center;
    overflow-x: hidden;
    padding: 30px 15px;
}

/* Animated Background */

.background {
    position: fixed;
    inset: 0;
    overflow: hidden;
    pointer-events: none;
    z-index: -1;
}

.orb {
    position: absolute;
    border-radius: 50%;
    filter: blur(70px);
    opacity: .35;
    animation: float 10s infinite ease-in-out;
}

.orb1 {
    width: 250px;
    height: 250px;
    background: #7c3aed;
    top: 5%;
    left: 5%;
}

.orb2 {
    width: 300px;
    height: 300px;
    background: #00e5ff;
    bottom: 5%;
    right: 5%;
    animation-delay: -4s;
}

.orb3 {
    width: 180px;
    height: 180px;
    background: #ec4899;
    top: 45%;
    right: 30%;
    animation-delay: -7s;
}

@keyframes float {
    0%,100% {
        transform: translate(0,0) scale(1);
    }

    50% {
        transform: translate(40px,-30px) scale(1.15);
    }
}

/* Main Calculator */

.calculator {
    width: min(1100px, 100%);
    background: var(--panel);
    border: 1px solid var(--border);
    backdrop-filter: blur(25px);
    border-radius: 28px;
    padding: 25px;
    box-shadow:
        0 30px 80px rgba(0,0,0,.35),
        0 0 50px rgba(0,229,255,.08);
}

/* Header */

.header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
}

.logo {
    display: flex;
    align-items: center;
    gap: 12px;
}

.logo-icon {
    width: 48px;
    height: 48px;
    border-radius: 15px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 25px;
    background: linear-gradient(135deg, var(--primary), var(--secondary));
    box-shadow: 0 0 25px rgba(0,229,255,.3);
}

.logo h1 {
    font-size: 22px;
}

.logo p {
    color: var(--muted);
    font-size: 12px;
    margin-top: 3px;
}

.header-buttons {
    display: flex;
    gap: 8px;
}

.icon-btn {
    border: 1px solid var(--border);
    background: var(--button);
    color: var(--text);
    width: 42px;
    height: 42px;
    border-radius: 12px;
    cursor: pointer;
    transition: .2s;
    font-size: 18px;
}

.icon-btn:hover {
    transform: translateY(-2px);
    background: var(--button-hover);
}

/* Layout */

.main {
    display: grid;
    grid-template-columns: 1fr 280px;
    gap: 20px;
}

/* Display */

.display {
    min-height: 170px;
    background: rgba(0,0,0,.2);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 22px;
    margin-bottom: 15px;
    position: relative;
    overflow: hidden;
}

.display::before {
    content: "";
    position: absolute;
    width: 150px;
    height: 150px;
    background: var(--primary);
    filter: blur(80px);
    opacity: .08;
    right: -50px;
    top: -50px;
}

.mode-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
}

.mode {
    display: flex;
    gap: 6px;
}

.mode button {
    border: 0;
    padding: 7px 13px;
    border-radius: 8px;
    background: var(--button);
    color: var(--muted);
    cursor: pointer;
    font-size: 12px;
}

.mode button.active {
    background: linear-gradient(135deg,var(--primary),var(--secondary));
    color: white;
}

.memory-status {
    font-size: 12px;
    color: var(--muted);
}

.expression {
    color: var(--muted);
    min-height: 25px;
    font-size: 16px;
    text-align: right;
    word-break: break-all;
}

.result {
    font-size: clamp(30px,5vw,50px);
    font-weight: bold;
    text-align: right;
    margin-top: 10px;
    overflow-x: auto;
    white-space: nowrap;
    text-shadow: 0 0 20px rgba(0,229,255,.25);
}

.copy-btn {
    position: absolute;
    left: 20px;
    bottom: 18px;
    background: transparent;
    border: 0;
    color: var(--muted);
    cursor: pointer;
}

/* Buttons */

.buttons {
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 9px;
}

button.calc-btn {
    min-height: 52px;
    border: 1px solid var(--border);
    border-radius: 13px;
    background: var(--button);
    color: var(--text);
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: all .15s ease;
}

button.calc-btn:hover {
    transform: translateY(-3px);
    background: var(--button-hover);
    box-shadow: 0 8px 20px rgba(0,0,0,.15);
}

button.calc-btn:active {
    transform: scale(.94);
}

.function {
    color: var(--primary) !important;
}

.operator {
    color: #c084fc !important;
}

.clear {
    color: #fb7185 !important;
}

.equals {
    background: linear-gradient(135deg,var(--primary),var(--secondary)) !important;
    color: white !important;
    border: none !important;
    box-shadow: 0 0 20px rgba(0,229,255,.2);
}

.zero {
    grid-column: span 2;
}

/* History */

.history {
    background: rgba(0,0,0,.15);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 18px;
    height: 100%;
    min-height: 400px;
}

.history-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 15px;
}

.history-header h2 {
    font-size: 17px;
}

.clear-history {
    border: 0;
    background: transparent;
    color: var(--danger);
    cursor: pointer;
    font-size: 12px;
}

.history-list {
    display: flex;
    flex-direction: column;
    gap: 9px;
    max-height: 500px;
    overflow-y: auto;
}

.history-item {
    padding: 12px;
    border-radius: 12px;
    background: var(--button);
    cursor: pointer;
    transition: .2s;
}

.history-item:hover {
    transform: translateX(-3px);
}

.history-expression {
    color: var(--muted);
    font-size: 12px;
    overflow: hidden;
    text-overflow: ellipsis;
}

.history-result {
    font-weight: bold;
    margin-top: 4px;
}

.empty-history {
    color: var(--muted);
    text-align: center;
    padding-top: 50px;
    font-size: 13px;
}

/* Footer */

.footer {
    text-align: center;
    color: var(--muted);
    font-size: 11px;
    margin-top: 20px;
}

/* Responsive */

@media(max-width:800px) {

    .main {
        grid-template-columns: 1fr;
    }

    .history {
        min-height: 200px;
    }

    .history-list {
        max-height: 180px;
    }
}

@media(max-width:500px) {

    body {
        padding: 10px;
    }

    .calculator {
        padding: 15px;
        border-radius: 20px;
    }

    .buttons {
        grid-template-columns: repeat(4,1fr);
    }

    .buttons .scientific-extra {
        display: none;
    }

    button.calc-btn {
        min-height: 48px;
        font-size: 13px;
    }

    .logo h1 {
        font-size: 18px;
    }
}
</style>
</head>

<body>

<div class="background">
    <div class="orb orb1"></div>
    <div class="orb orb2"></div>
    <div class="orb orb3"></div>
</div>

<div class="calculator">

    <div class="header">

        <div class="logo">
            <div class="logo-icon">∑</div>

            <div>
                <h1>Quantum Calculator</h1>
                <p>Scientific • Mathematical • Intelligent</p>
            </div>
        </div>

        <div class="header-buttons">
            <button class="icon-btn" onclick="toggleTheme()" title="Change Theme">
                ◐
            </button>

            <button class="icon-btn" onclick="clearAll()" title="Clear">
                AC
            </button>
        </div>

    </div>

    <div class="main">

        <div>

            <div class="display">

                <div class="mode-row">

                    <div class="mode">
                        <button id="degBtn"
                                class="active"
                                onclick="setAngleMode('DEG')">
                            DEG
                        </button>

                        <button id="radBtn"
                                onclick="setAngleMode('RAD')">
                            RAD
                        </button>
                    </div>

                    <div class="memory-status">
                        Memory: <span id="memoryDisplay">0</span>
                    </div>

                </div>

                <div class="expression" id="expression">
                    0
                </div>

                <div class="result" id="result">
                    0
                </div>

                <button class="copy-btn" onclick="copyResult()">
                    📋 Copy
                </button>

            </div>


            <div class="buttons">

                <!-- Scientific -->

                <button class="calc-btn function scientific-extra"
                        onclick="insertFunction('sin')">
                    sin
                </button>

                <button class="calc-btn function scientific-extra"
                        onclick="insertFunction('cos')">
                    cos
                </button>

                <button class="calc-btn function scientific-extra"
                        onclick="insertFunction('tan')">
                    tan
                </button>

                <button class="calc-btn function scientific-extra"
                        onclick="insertFunction('log')">
                    log
                </button>

                <button class="calc-btn function scientific-extra"
                        onclick="insertFunction('ln')">
                    ln
                </button>

                <button class="calc-btn function scientific-extra"
                        onclick="insertFunction('sqrt')">
                    √
                </button>


                <button class="calc-btn function"
                        onclick="insertFunction('asin')">
                    sin⁻¹
                </button>

                <button class="calc-btn function"
                        onclick="insertFunction('acos')">
                    cos⁻¹
                </button>

                <button class="calc-btn function"
                        onclick="insertFunction('atan')">
                    tan⁻¹
                </button>

                <button class="calc-btn function"
                        onclick="square()">
                    x²
                </button>

                <button class="calc-btn function"
                        onclick="insert('^')">
                    xʸ
                </button>

                <button class="calc-btn function"
                        onclick="factorial()">
                    n!
                </button>


                <!-- Memory -->

                <button class="calc-btn"
                        onclick="memoryClear()">
                    MC
                </button>

                <button class="calc-btn"
                        onclick="memoryRecall()">
                    MR
                </button>

                <button class="calc-btn"
                        onclick="memoryAdd()">
                    M+
                </button>

                <button class="calc-btn"
                        onclick="memorySubtract()">
                    M−
                </button>

                <button class="calc-btn function"
                        onclick="insert('π')">
                    π
                </button>

                <button class="calc-btn function"
                        onclick="insert('e')">
                    e
                </button>


                <!-- Controls -->

                <button class="calc-btn clear"
                        onclick="clearAll()">
                    AC
                </button>

                <button class="calc-btn clear"
                        onclick="backspace()">
                    ⌫
                </button>

                <button class="calc-btn operator"
                        onclick="insert('(')">
                    (
                </button>

                <button class="calc-btn operator"
                        onclick="insert(')')">
                    )
                </button>

                <button class="calc-btn operator"
                        onclick="insert('%')">
                    %
                </button>

                <button class="calc-btn operator"
                        onclick="insert('/')">
                    ÷
                </button>


                <!-- Numbers -->

                <button class="calc-btn"
                        onclick="insert('7')">
                    7
                </button>

                <button class="calc-btn"
                        onclick="insert('8')">
                    8
                </button>

                <button class="calc-btn"
                        onclick="insert('9')">
                    9
                </button>

                <button class="calc-btn operator"
                        onclick="insert('*')">
                    ×
                </button>

                <button class="calc-btn"
                        onclick="insert('4')">
                    4
                </button>

                <button class="calc-btn"
                        onclick="insert('5')">
                    5
                </button>


                <button class="calc-btn"
                        onclick="insert('6')">
                    6
                </button>

                <button class="calc-btn operator"
                        onclick="insert('-')">
                    −
                </button>

                <button class="calc-btn"
                        onclick="insert('1')">
                    1
                </button>

                <button class="calc-btn"
                        onclick="insert('2')">
                    2
                </button>

                <button class="calc-btn"
                        onclick="insert('3')">
                    3
                </button>

                <button class="calc-btn operator"
                        onclick="insert('+')">
                    +
                </button>

                <button class="calc-btn zero"
                        onclick="insert('0')">
                    0
                </button>

                <button class="calc-btn"
                        onclick="insert('.')">
                    .
                </button>

                <button class="calc-btn equals"
                        onclick="calculate()">
                    =
                </button>

            </div>

        </div>


        <!-- History -->

        <div class="history">

            <div class="history-header">

                <h2>Calculation History</h2>

                <button class="clear-history"
                        onclick="clearHistory()">
                    Clear
                </button>

            </div>

            <div class="history-list"
                 id="historyList">

                <div class="empty-history">
                    Your calculations will appear here.
                </div>

            </div>

        </div>

    </div>

    <div class="footer">
        Quantum Scientific Calculator • HTML • CSS • JavaScript
    </div>

</div>


<script>

let currentExpression = "";
let lastResult = 0;
let memory = 0;
let angleMode = "DEG";

const expressionElement =
    document.getElementById("expression");

const resultElement =
    document.getElementById("result");

const memoryElement =
    document.getElementById("memoryDisplay");

const historyList =
    document.getElementById("historyList");


/* Insert */

function insert(value) {

    if (currentExpression === "Error") {
        currentExpression = "";
    }

    currentExpression += value;

    expressionElement.textContent =
        currentExpression;

    resultElement.textContent =
        previewCalculation();
}


/* Functions */

function insertFunction(func) {

    if (func === "sqrt") {
        currentExpression += "sqrt(";
    } else {
        currentExpression += func + "(";
    }

    expressionElement.textContent =
        currentExpression;
}


/* Square */

function square() {

    if (!currentExpression) return;

    currentExpression =
        "(" + currentExpression + ")^2";

    expressionElement.textContent =
        currentExpression;
}


/* Factorial */

function factorial() {

    if (!currentExpression) return;

    currentExpression += "!";

    expressionElement.textContent =
        currentExpression;
}


/* Backspace */

function backspace() {

    currentExpression =
        currentExpression.slice(0,-1);

    expressionElement.textContent =
        currentExpression || "0";

    resultElement.textContent =
        previewCalculation();
}


/* Clear */

function clearAll() {

    currentExpression = "";

    expressionElement.textContent = "0";

    resultElement.textContent = "0";
}


/* Angle Mode */

function setAngleMode(mode) {

    angleMode = mode;

    document
        .getElementById("degBtn")
        .classList.toggle("active", mode === "DEG");

    document
        .getElementById("radBtn")
        .classList.toggle("active", mode === "RAD");

    resultElement.textContent =
        previewCalculation();
}


/* Convert expression */

function prepareExpression(expr) {

    expr = expr
        .replaceAll("π", "Math.PI")
        .replace(/\be\b/g, "Math.E")
        .replaceAll("^", "**")
        .replaceAll("sqrt(", "Math.sqrt(")
        .replaceAll("ln(", "Math.log(")
        .replaceAll("log(", "Math.log10(");

    if (angleMode === "DEG") {

        expr = expr
            .replaceAll(
                "sin(",
                "Math.sin((Math.PI/180)*("
            )
            .replaceAll(
                "cos(",
                "Math.cos((Math.PI/180)*("
            )
            .replaceAll(
                "tan(",
                "Math.tan((Math.PI/180)*("
            );

    } else {

        expr = expr
            .replaceAll("sin(", "Math.sin(")
            .replaceAll("cos(", "Math.cos(")
            .replaceAll("tan(", "Math.tan(");

    }

    expr = expr
        .replaceAll("asin(", "Math.asin(")
        .replaceAll("acos(", "Math.acos(")
        .replaceAll("atan(", "Math.atan(");

    return expr;
}


/* Factorial replacement */

function processFactorials(expr) {

    const factorialRegex =
        /(\d+(?:\.\d+)?)!/g;

    return expr.replace(
        factorialRegex,
        function(match, number) {

            let n = Number(number);

            if (n < 0 || n > 170) {
                throw new Error("Invalid factorial");
            }

            let result = 1;

            for (
                let i = 2;
                i <= Math.floor(n);
                i++
            ) {
                result *= i;
            }

            return result;
        }
    );
}


/* Calculate */

function calculate() {

    if (!currentExpression) return;

    try {

        let expression =
            processFactorials(currentExpression);

        expression =
            prepareExpression(expression);

        let result =
            Function(
                '"use strict"; return (' +
                expression +
                ')'
            )();

        if (!Number.isFinite(result)) {
            throw new Error();
        }

        result =
            Number.parseFloat(
                Number(result).toPrecision(12)
            );

        lastResult = result;

        resultElement.textContent =
            result;

        addHistory(
            currentExpression,
            result
        );

    } catch(error) {

        resultElement.textContent =
            "Error";
    }
}


/* Preview */

function previewCalculation() {

    if (!currentExpression) return "0";

    try {

        let expression =
            processFactorials(currentExpression);

        expression =
            prepareExpression(expression);

        let result =
            Function(
                '"use strict"; return (' +
                expression +
                ')'
            )();

        if (!Number.isFinite(result)) {
            return "";
        }

        return Number(result)
            .toPrecision(10)
            .replace(/\.?0+$/,"");

    } catch {

        return "";
    }
}


/* History */

function addHistory(expression, result) {

    if (
        historyList.children.length === 1 &&
        historyList.children[0].classList.contains(
            "empty-history"
        )
    ) {
        historyList.innerHTML = "";
    }

    const item =
        document.createElement("div");

    item.className = "history-item";

    item.innerHTML = `
        <div class="history-expression">
            ${escapeHTML(expression)}
        </div>

        <div class="history-result">
            = ${escapeHTML(String(result))}
        </div>
    `;

    item.onclick = function() {

        currentExpression = expression;

        expressionElement.textContent =
            expression;

        resultElement.textContent =
            result;
    };

    historyList.prepend(item);
}


/* Clear History */

function clearHistory() {

    historyList.innerHTML = `
        <div class="empty-history">
            Your calculations will appear here.
        </div>
    `;
}


/* Memory */

function memoryClear() {

    memory = 0;

    updateMemory();
}

function memoryRecall() {

    insert(String(memory));
}

function memoryAdd() {

    let value =
        Number(previewCalculation());

    if (!Number.isNaN(value)) {

        memory += value;

        updateMemory();
    }
}

function memorySubtract() {

    let value =
        Number(previewCalculation());

    if (!Number.isNaN(value)) {

        memory -= value;

        updateMemory();
    }
}

function updateMemory() {

    memoryElement.textContent =
        Number(memory.toPrecision(10));
}


/* Theme */

function toggleTheme() {

    document.body.classList.toggle("light");

    localStorage.setItem(
        "calculatorTheme",
        document.body.classList.contains("light")
            ? "light"
            : "dark"
    );
}


/* Load Theme */

if (
    localStorage.getItem("calculatorTheme")
    === "light"
) {
    document.body.classList.add("light");
}


/* Copy */

function copyResult() {

    navigator.clipboard.writeText(
        resultElement.textContent
    );

    const old =
        resultElement.textContent;

    resultElement.textContent =
        "Copied!";

    setTimeout(() => {

        resultElement.textContent = old;

    }, 800);
}


/* Keyboard */

document.addEventListener(
    "keydown",
    function(event) {

        const key = event.key;

        if (
            /[0-9+\-*/().%]/.test(key)
        ) {

            insert(key);

        } else if (key === "Enter") {

            calculate();

        } else if (key === "Backspace") {

            backspace();

        } else if (key === "Escape") {

            clearAll();

        } else if (key === "^") {

            insert("^");
        }
    }
);


/* Security helper */

function escapeHTML(value) {

    return value
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
}

</script>

</body>
</html>
